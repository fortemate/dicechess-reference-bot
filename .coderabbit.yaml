# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# =============================================================================
# CodeRabbit Configuration — Dice Chess Reference Bot (Scala 3 / Cats Effect / HTTP4s)
# =============================================================================
# Reference starter kit and Bot API client for the Dice Chess platform.
# =============================================================================

language: en-US

reviews:
  profile: assertive

  high_level_summary: false
  poem: false
  collapse_walkthrough: true

  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!**/target/**"
    - "!**/project/target/**"
    - "!**/*.lock"

  tools:
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true

  path_instructions:
    - path: "**/*.scala"
      instructions: |
        Modern Scala 3 conventions for the Dice Chess reference bot.
        When reviewing:
        - Effect handling: Cats Effect 3 / FS2 concurrency best practices.
        - Comments explain "Why", not "What"; don't document self-evident methods.
        - Ensure correct error handling and reconnect semantics for long-lived streams.
        - Keep `Strategy.scala` isolated so bot creators can easily swap out the move decision algorithm.

    - path: ".github/workflows/**"
      instructions: |
        CI/CD for a Scala 3 JVM application published as a multi-arch container image.
        When reviewing:
        - Prefer pinned action versions.
        - Ensure GITHUB_TOKEN / packages:read is present where `dicechess-engine` is resolved.

    - path: "build.sbt"
      instructions: |
        SBT build for Scala 3 on sbt 2.x.
        When reviewing:
        - Keep library versions consistent and compatible with Scala 3.8.4.
        - Verify the GitHub Packages resolver/credentials stay free of network calls at load time.

[tools]
java = "temurin-25"
sbt = "2.0.8" # sbt runner; MUST match sbt.version in project/build.properties (also provisions the Jules VM)
scalafmt = "3.11.4"
actionlint = "1.7.12"
betterleaks = "latest"
lefthook = "latest"

[tasks.setup]
description = "📦 Install local toolchain and register git hooks"
run = """
mise install
lefthook install
"""

[tasks.compile]
description = "🏗️ Compile Scala sources"
run = "sbt compile"

[tasks.test]
description = "🧪 Run unit test suites"
run = "sbt test"

[tasks.coverage]
description = "📊 Run tests with coverage and generate report"
# Same `testOnly *` + throwaway-localcache reasoning as [tasks.check] below: a plain `test`
# here would report `Passed: Total 0` on a repeat run and produce a report of nothing.
run = 'sbt shutdown && rm -rf target/covcache && sbt -Dsbt.global.localcache="$PWD/target/covcache" "clean; coverage; testOnly *; coverageReport"'

[tasks.check]
description = "✅ Run full validation (format check + clean + test + coverage)"
# The sbt invocation below is byte-for-byte what ci.yaml runs — change the two together.
#
# `testOnly *`, not `test`: sbt 2's `test` skips a repeat run over unchanged sources and its
# skip-state outlives `clean`, so the second run reports `Passed: Total 0` and exits 0. The
# throwaway per-workspace localcache stops one run's skip-state leaking into the next.
run = 'sbt shutdown && rm -rf target/covcache && sbt -Dsbt.global.localcache="$PWD/target/covcache" "scalafmtCheckAll; clean; coverage; testOnly *; coverageReport"'

[tasks.format]
description = "🎨 Format code with scalafmt"
run = "sbt 'scalafmtAll; scalafmtSbt'"

[tasks."format:check"]
description = "🔍 Check code formatting with scalafmt"
run = "sbt 'scalafmtCheckAll; scalafmtSbtCheck'"
